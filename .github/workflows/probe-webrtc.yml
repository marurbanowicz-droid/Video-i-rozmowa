name: ProbeWebrtc
on:
  push:
    branches: [probe-webrtc-api]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://repo1.maven.org/maven2/io/getstream/stream-webrtc-android/maven-metadata.xml | grep -o '<version>[^<]*' | tail -4 | tr '\n' ' ' | sed 's/^/::notice title=versions::/'
          for v in $(curl -s https://repo1.maven.org/maven2/io/getstream/stream-webrtc-android/maven-metadata.xml | grep -o '<release>[^<]*' | cut -d'>' -f2); do
            curl -sfLo b.aar https://repo1.maven.org/maven2/io/getstream/stream-webrtc-android/$v/stream-webrtc-android-$v.aar
            unzip -oq b.aar classes.jar
            javap -cp classes.jar org.webrtc.AudioTrack | tr '\n' '|' | sed "s/^/::notice title=latest-$v::/"
            javap -cp classes.jar 'org.webrtc.audio.JavaAudioDeviceModule$Builder' | grep -i 'callback' | tr '\n' '|' | sed "s/^/::notice title=latest-b::/"
          done
