name: ProbeWebrtc
on:
  push:
    branches: [probe-webrtc-api]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sfLo a.aar https://repo1.maven.org/maven2/io/getstream/stream-webrtc-android/1.1.3/stream-webrtc-android-1.1.3.aar
          unzip -oq a.aar classes.jar
          javap -cp classes.jar 'org.webrtc.audio.JavaAudioDeviceModule$Builder' | tr '\n' '|' | sed 's/^/::notice title=builder::/'
          javap -cp classes.jar org.webrtc.AudioTrack | tr '\n' '|' | sed 's/^/::notice title=audiotrack::/'
          unzip -l classes.jar | grep -i 'AudioTrack\|AudioSamples\|Sink\|Callback' | awk '{print $4}' | tr '\n' '|' | sed 's/^/::notice title=classes::/'
