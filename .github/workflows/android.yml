name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Wersja
        id: ver
        run: |
          v=$(grep '^versionName=' android/version.properties | cut -d= -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Klucz podpisu
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trener.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/trener.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu KEYSTORE_B64 – APK podpisany kluczem testowym (bez publikacji wydania)"
          fi

      - name: Budowanie APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Błędy kompilacji (adnotacje)
        if: failure()
        run: |
          grep -E '^e: |error:|What went wrong|Could not|FAILURE|> ' build.log | head -60 > errs.txt || true
          i=0
          while IFS= read -r line; do
            i=$((i+1)); [ $i -gt 45 ] && break
            esc=$(printf '%s' "$line" | sed -e 's/%/%25/g')
            echo "::error title=build-$i::$esc"
          done < errs.txt

      - name: Nazwa pliku
        run: cp android/app/build/outputs/apk/release/app-release.apk "trener-na-wodzie-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trener-na-wodzie-${{ steps.ver.outputs.version }}
          path: trener-na-wodzie-${{ steps.ver.outputs.version }}.apk

      - name: Publikacja (Release)
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag już istnieje – pomijam"
          else
            gh release create "$tag" "trener-na-wodzie-${{ steps.ver.outputs.version }}.apk" \
              --title "Trener na wodzie – Android ${{ steps.ver.outputs.version }}" \
              --notes "Pobierz plik .apk na telefon z Androidem i zainstaluj. Aktualizacje aplikacja sprawdza sama (Ustawienia → Aplikacja)." \
              --latest
          fi
